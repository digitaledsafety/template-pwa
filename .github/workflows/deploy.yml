name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        
  deploy:
    needs: test
    # This line ensures the job only runs on the main branch. 
    # It will be marked as "skipped" on Pull Requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  build-android:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Keystore
        # Using the logic to decode or generate a fallback key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Decoding signing key..."
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.keystore
          else
            echo "No key found. Generating temporary build key..."
            keytool -genkey -v -keystore release.keystore -alias "${{ secrets.ALIAS || 'default_alias' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US" -storepass "${{ secrets.KEY_STORE_PASSWORD || 'default_password' }}" -keypass "${{ secrets.KEY_PASSWORD || 'default_password' }}"
          fi

      - name: Build Android App Bundle
        run: |
          bubblewrap build --yes --jdkPath "$JAVA_HOME" --androidSdkPath "$ANDROID_HOME"
        env:
          BUBBLEWRAP_KEYSTORE_PATH: ./release.keystore
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || 'default_password' }}
          BUBBLEWRAP_KEY_ALIAS: ${{ secrets.ALIAS || 'default_alias' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'default_password' }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-android-bundle
          path: ./*.aab
