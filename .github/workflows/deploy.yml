name: Deploy PWA and Android App

on:
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test

  android-build:
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF

      - name: Prepare Android Project
        run: |
          # Derive app name and other metadata
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          PACKAGE_ID="com.${REPO_OWNER_LOWER}.${REPO_NAME//-/_}"
          DOMAIN="${REPO_OWNER_LOWER}.github.io"
          URL_PATH="/${REPO_NAME}/"

          # Initialize bubblewrap project using local manifest
          bubblewrap init --manifest=manifest.json --directory=. --confirm

          # Override packageId and other fields to ensure consistency
          jq ".packageId = \"$PACKAGE_ID\" | .host = \"$DOMAIN\" | .startUrl = \"$URL_PATH\"" twa-manifest.json > twa-manifest.tmp.json && mv twa-manifest.tmp.json twa-manifest.json

      - name: Setup Signing Key
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "No keystore found in secrets. Generating a temporary one for this build."
            keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android, OU=Dev, O=Dev, L=Dev, S=Dev, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=android" >> $GITHUB_ENV
            echo "IS_TEMPORARY_KEY=true" >> $GITHUB_ENV
          else
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android.keystore
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "IS_TEMPORARY_KEY=false" >> $GITHUB_ENV
          fi

      - name: Build Android App (APK & AAB)
        run: |
          bubblewrap build --signingKeyPath=android.keystore --signingKeyPassword=${{ env.ANDROID_KEYSTORE_PASSWORD }} --signingKeyAlias=${{ env.ANDROID_KEY_ALIAS }} --signingKeyAliasPassword=${{ env.ANDROID_KEY_PASSWORD }}

      - name: Extract Asset Links
        run: |
          # Extract SHA256 from the keystore to generate assetlinks.json later
          SHA256=$(keytool -list -v -keystore android.keystore -alias ${{ env.ANDROID_KEY_ALIAS }} -storepass ${{ env.ANDROID_KEYSTORE_PASSWORD }} | grep SHA256 | awk '{print $2}')
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          PACKAGE_ID="com.${REPO_OWNER_LOWER}.${REPO_NAME//-/_}"

          mkdir -p .well-known
          cat <<EOF > .well-known/assetlinks.json
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "$PACKAGE_ID",
              "sha256_cert_fingerprints": ["$SHA256"]
            }
          }]
          EOF

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            *.apk
            *.aab
            .well-known/assetlinks.json
            android.keystore

      - name: Create Release and Upload Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.aab
          fail_on_unmatched_files: true

  deploy:
    needs: [test, android-build]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Asset Links
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-artifacts

      - name: Move Asset Links to Web Root
        run: |
          mkdir -p .well-known
          cp android-artifacts/.well-known/assetlinks.json .well-known/assetlinks.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
